schema_version: "1.0"

extension:
  id: "maqa"
  name: "MAQA — Multi-Agent & Quality Assurance"
  version: "0.3.0"
  description: "Idempotent, agent-neutral coordinator + worker + QA workflow with GitHub Issues as the source of truth."
  author: "GenieRobot"
  repository: "https://github.com/GenieRobot/spec-kit-maqa-ext"
  license: "MIT"
  homepage: "https://github.com/GenieRobot/spec-kit-maqa-ext"

requires:
  speckit_version: ">=0.3.0"
  commands:
    - "speckit.taskstoissues"

provides:
  commands:
    - name: "speckit.maqa.coordinator"
      file: "commands/speckit.maqa.coordinator.md"
      description: "Assess ready GitHub issues, reuse worktrees, and return a provider-neutral SPAWN plan"
      aliases: ["speckit.maqa"]

    - name: "speckit.maqa.sync"
      file: "commands/speckit.maqa.sync.md"
      description: "Idempotently reconcile Spec Kit tasks with GitHub Issues using taskstoissues without creating duplicates"

    - name: "speckit.maqa.feature"
      file: "commands/speckit.maqa.feature.md"
      description: "Implement one GitHub issue in one worktree. Tests optional. Reports done or blocked."

    - name: "speckit.maqa.qa"
      file: "commands/speckit.maqa.qa.md"
      description: "Validate one issue implementation against its issue and local spec context."

    - name: "speckit.maqa.setup"
      file: "commands/speckit.maqa.setup.md"
      description: "Idempotent, agent-neutral bootstrap for MAQA config, repository identity, and GitHub labels"

  config:
    - name: "maqa-config.yml"
      template: "config-template.yml"
      description: "MAQA workflow configuration (GitHub Issues source, tests, QA, parallelism, pushes, and cadence)"
      required: false

hooks:
  after_tasks:
    command: "speckit.maqa.sync"
    optional: true
    prompt: "Idempotently reconcile these tasks into the GitHub issues MAQA uses as its source of truth?"
    description: "Create only missing issues through Spec Kit taskstoissues, preserving existing issue state"

tags:
  - "multi-agent"
  - "orchestration"
  - "quality-assurance"
  - "workflow"
  - "parallel"
  - "tdd"
  - "github-issues"
  - "idempotent"
  - "agent-neutral"
