# MAQA — Multi-Agent & Quality Assurance
# Generated by: specify ext add maqa
# Docs: https://github.com/GenieRobot/spec-kit-maqa-ext

# ── Work source ───────────────────────────────────────────────────────────────
# GitHub Issues created by Spec Kit's /speckit.taskstoissues command are the
# authoritative backlog and status store. tasks.md remains read-only context for
# dependency ordering and worker/QA checklists.
source_of_truth: "github-issues"

# MAQA manages these labels on the repository identified by remote.origin.url.
# Closed issues are done; open issues without a state label are ready/todo.
github_label_prefix: "maqa"

# "auto" lets the parent AI use native parallel delegation when available and
# otherwise execute the same provider-neutral SPAWN plan sequentially.
dispatch_mode: "auto"

# ── Test runner ───────────────────────────────────────────────────────────────
# Leave empty to skip all test steps.
test_command: ""          # Full suite  e.g. "npm test", "pytest", "bundle exec rspec"
test_file_command: ""     # Single file e.g. "pytest {file}", "npm test -- {file}"

# ── TDD mode ──────────────────────────────────────────────────────────────────
# When true: write test first → implement → confirm green.
# Red is assumed (no pre-run). Requires test_file_command to be set.
tdd: false

# ── Optional board mirrors ────────────────────────────────────────────────────
# Trello, Linear, GitHub Projects, Jira, and Azure DevOps companions may mirror
# issue state, but they never replace GitHub Issues as MAQA's source of truth.
board_mirror: "none"

# ── Parallelism ───────────────────────────────────────────────────────────────
max_parallel: 3           # Max concurrent feature agents

# ── Worktrees ─────────────────────────────────────────────────────────────────
# Worktrees are created as siblings of the repo root.
# Change if your layout requires a different base.
worktree_base: ".."       # Relative to repo root

# ── Git workflow ──────────────────────────────────────────────────────────────
# Feature agents always commit before returning. Push is optional.
# WARNING: disabling auto_push means branches only exist in the worktree.
# If the worktree is deleted before merging, all uncommitted/unpushed work is lost.
auto_push: false          # Push feature branch after commit (recommended: true for safety)

# ── QA cadence ────────────────────────────────────────────────────────────────
# "per_feature": QA runs after each feature agent completes (catches regressions early)
# "batch_end":   QA runs once when all features in a batch are done (saves credits)
qa_cadence: "per_feature"

# ── QA checks ─────────────────────────────────────────────────────────────────
# Disable checks that don't apply to your project type.
qa:
  text: true              # Spelling, grammar, placeholder copy
  links: true             # Link / route verification
  security: true          # Unfiltered output, exposed params, missing auth
  accessibility: false    # WCAG 2.1 AA — enable for web projects
  responsive: false       # Mobile / responsive layout — enable for web projects
  empty_states: false     # Empty / error state coverage — enable for UI projects
